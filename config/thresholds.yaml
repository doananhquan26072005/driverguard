# All tunable thresholds for DriverGuard. Logic modules must read from here,
# never hardcode values. Each threshold lives in exactly one place, and an unknown
# (e.g. mistyped) key stops the agent at startup instead of silently using a default.

# Block 1 - Frame camera
capture:
  # Requested camera settings (the driver may ignore them).
  camera_width: 1280
  camera_height: 720
  camera_fps: 30
  # Play video files at their native FPS to simulate a live camera.
  # false = decode as fast as possible (useful for offline eval).
  video_realtime: true
  # Fallback FPS when the video file reports 0 / invalid FPS.
  video_fallback_fps: 30.0
  # Camera lost after this many consecutive failed reads: release it and reopen it every
  # reconnect_interval_s (0 = stop instead). No frame for frame_timeout_s also counts as
  # lost. While lost, the HUD shows it and a camera_lost event goes to the backend.
  max_consecutive_failures: 30
  reconnect_interval_s: 2.0
  frame_timeout_s: 3.0

# Block 2 - Preprocessing
preprocess:
  # Output width in pixels, aspect ratio preserved. Frames are only downscaled.
  target_width: 640
  # A 3-channel frame counts as IR/grayscale when the mean absolute difference
  # between its channels is below this value (0-255 scale).
  ir_channel_diff_max: 2.0
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid: 8

# Block 3 - Face landmarks (MediaPipe Face Landmarker)
landmarks:
  # Relative to project root. Download with: python tools/download_models.py
  model_path: models/face_landmarker.task
  # Track up to 2 faces. Before driver enrollment the largest one is the driver; after it, the
  # face that best matches the enrolled driver: score = shape distance / driver_shape_tol
  # + centre distance / (driver_position_tol x enrolled inter-ocular distance), lowest wins.
  num_faces: 2
  driver_shape_tol: 0.08        # mean relative difference of the landmark-ratio signature
  driver_position_tol: 2.0      # in enrolled inter-ocular distances
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  # Also output MediaPipe blendshapes (same model, no measurable cost): eyeBlink feeds block 5.
  blendshapes: true

# Block 5 - Eye-state CNN (Open Model Zoo open-closed-eye-0001, Apache-2.0, 46 KB)
# Only called when EAR is not reliable; otherwise EAR alone decides (block 7).
eye_state:
  enabled: true
  source: cnn                   # eye-state score when EAR is not reliable: blendshape (eyeBlink, block 3) | cnn
  model_path: models/open_closed_eye.onnx   # python tools/download_models.py
  input_size: 32
  crop_scale: 1.8               # crop side = 1.8 x eye-corner distance (as in Intel's demo)
  mean: 127.0                   # input = (BGR - mean) / scale
  scale: 255.0
  closed_index: 0               # softmax index of "closed" (Intel demo: out[0] < out[1] = open)
  run_on_ir: true               # infrared / grayscale camera: call the CNN
  # Mean luminance 0-255 of the FACE (before CLAHE) below this: EAR not trusted, the score decides.
  # 0 = off (was 60 until 06/10): in low light the CNN was wrong both ways while EAR was not.
  # Own recordings, face 32-35 (eval/results/own_recordings.md): eyes open and still for 5.5 min,
  # the CNN said "closed" on 28 % of frames (EAR 0.71 x baseline, eyeBlink 0.19) -> 8 false L3;
  # with 0: none, and 27 / 27 acted closures still reach L3. Same videos darkened in RAM
  # (lighting_transforms.md, face 49): the CNN missed every closure. Dataset replays with 0: FL3D
  # microsleeps with a new L3 72 -> 74 of 95, YawDD and SUST alerts unchanged. One person and one
  # webcam for the real dim light: PROVISIONAL. Below quality.dark_face_brightness nothing is read.
  low_light_brightness: 0
  ear_asymmetry_max: 0.35       # |EAR_L - EAR_R| / max(EAR_L, EAR_R) above this (glare, occlusion): EAR not trusted
  ear_asymmetry_min_open: 0.18  # ... only while one eye still looks open (EAR >= this); both closed = they agree
  hold_s: 2.0                   # keep the CNN this long after an ir / low_light trigger clears (no EAR <-> CNN flicker at dusk); not after ear_asymmetry (glasses: CNN weak)
  always_run: false             # true = every frame (debug, evaluation)

# Block 6 - Feature extractor
features:
  # Focal length in pixels = focal_length_scale * image width (uncalibrated camera).
  focal_length_scale: 1.0
  # face_conf = fraction of the 478 landmarks inside the image. Below this, the face is
  # partly out of frame and its landmarks are extrapolated: blocks 7 and 8 treat the frame
  # as not measurable (no EAR / PERCLOS / eye baseline, no head pose, no MAR).
  min_face_conf: 0.9

# Block 6 stage - Frame quality (edge_agent/perception/quality.py, PRD FR-6): what makes a frame
# unusable, from numbers only. An issue that lasts becomes "monitoring unavailable" with that
# reason in block 9 (risk.unavailable). A number that was not measured is never an issue.
# PROVISIONAL limits. Outside what the datasets here show (12 videos each, face found: face
# luminance 49-200, sharpness 4.4-670; night image NITYMED: mean 45-65, spread 15-29), and placed
# where the same videos darkened / overexposed / blurred in RAM stop being read
# (eval/results/lighting_transforms.md): FL3D microsleeps reaching L3 fall 18 -> 9 of 24 at a
# median face luminance of 230, and 17 -> 2 between sharpness 5.1 and 2.3.
# Own recordings in real dim light (one person, laptop webcam): face 32-35 is read by EAR (27 / 27
# acted closures at L3, no false L3 in 5.5 min still); face 10-12 is not (5 false L3 in 2.9 min with
# this limit off), so the limit stays between the two. A grey / infrared image is NOT covered:
# block 5's eye CNN decides there and misses nearly every closure on greyed videos.
quality:
  enabled: true
  dark_face_brightness: 25      # mean face luminance 0-255 (before CLAHE) below this: too dark; 0 = off
  glare_face_brightness: 225    # ... above this: washed out (sun on the face); 0 = off
  # Laplacian variance of the face's luminance below this: blurred (dirty lens, out of focus). 0 = off.
  blur_sharpness: 3.0
  # No face AND the whole image nearly black or nearly flat: the lens is covered (camera_blocked),
  # not a driver out of view. 0 = off.
  blocked_brightness: 12
  blocked_contrast: 6           # spread (std) of the image luminance
  clear_s: 1.0                  # usable frames for this long end an issue
  window_s: 10                  # quality score = usable share of this window (HUD state, traces)
  max_gap_s: 0.5                # a longer gap between frames adds no time

# Block 6 stage - Driver enrollment (edge_agent/perception/enrollment.py)
# Mandatory, at a stop, once per trip; nothing is stored after the trip. Three steps, each
# counting only good frames (face fully in view, EAR trusted, pose known); a blink or a
# glance away pauses the step clock. 15 FPS x 2 s = 30 frames: one blink (~5 frames) does
# not move the median. Monitoring runs on the self-learnt baselines until it is done.
enrollment:
  enabled: true
  # The HUD first explains why the face is enrolled and that no image is stored or sent; the steps
  # start only when the driver taps "Đồng ý" ("Để sau": asked again at the next stop). Once per
  # driver. Off on a device run without HUD (--hud-port 0): nobody could answer.
  require_consent: true
  look_camera_s: 2.0            # step 1: open-eye EAR, closed-mouth MAR, face signature
  look_road_s: 3.0              # step 2: head pose when looking at the road
  close_eyes_s: 2.0             # step 3: closed-eye EAR (ends with a beep)
  road_settle_s: 1.0            # start of step 2 not used: the eyes are still moving to the road
  step_timeout_s: 12.0          # not finished in this long: redo the step with a hint
  max_attempts: 3               # tries per step; then wait until the vehicle moved and stopped again
  max_gap_s: 0.5                # a longer gap between good frames adds no step time
  facing_max_deg: 20            # step 1: |yaw|, |pitch| at most this (facing the camera)
  eye_blink_shut: 0.5           # MediaPipe eyeBlink at or above this = eyes shut
  ear_spread_max: 0.15          # step 1: (p90 - p10) / median EAR at most this (steady eyes)
  mar_closed_max: 0.25          # step 1: mouth closed
  pose_spread_max_deg: 6.0      # step 2: p90 - p10 of yaw / pitch at most this (head held still)
  # Step 3: a frame is shut when EAR < closed_ear_ratio x the step-1 EAR (and eyeBlink agrees);
  # EAR that never gets there (glare on glasses) times the step out instead of learning a bad value.
  closed_ear_ratio: 0.6
  reopen_grace_s: 2.0           # drowsiness alerts stay off this long after step 3 (eyes open on the beep)

# Block 4 - Phone detector (YOLOv8n ONNX, runs on its own thread)
phone:
  model_path: models/yolov8n.onnx
  input_size: 640          # must match the ONNX export size
  class_id: 67             # COCO "cell phone"
  conf_threshold: 0.35
  iou_threshold: 0.45
  target_fps: 5            # YOLO runs ~5x/s, main loop reuses the latest result
  num_threads: 2           # onnxruntime threads, leave CPU for MediaPipe (#/live: only on a cross-origin isolated page, else 1)
  max_result_age_s: 0.6    # older results count as "unknown"
  # Phone detection not working (M50): at least unknown_ratio of the last unknown_window_s of frames
  # had no fresh result (YOLO slower than max_result_age_s, model not loaded, worker dead). The HUD
  # shows it and the backend gets `phone_detection_lost`; back below unknown_clear_ratio:
  # `phone_detection_restored`. The other branches go on. unknown_window_s 0 = off. PROVISIONAL.
  unknown_window_s: 10.0
  unknown_ratio: 0.8
  unknown_clear_ratio: 0.5
  # Driver zone = face box grown by these factors (x face width, y face height).
  # Covers a phone at the ear (call) and in front of the chest (texting);
  # a passenger's phone outside this zone is ignored.
  zone_expand_x: 1.0
  zone_expand_up: 0.5
  zone_expand_down: 1.5
  # A phone in front of the face often hides the face: keep using the last face box
  # for this long, so the driver zone (and phone_near_face) is still known.
  face_memory_s: 3.0
  # How the phone is held (M38, recorded only: the alert stays `phone`, L2). Phone centre against
  # the face box: sideways from the face centre in face widths, down from the top of the face in
  # face heights (0 = forehead, 1 = chin). call = beside the face at or above the chin;
  # text = below the chin; anything else = unknown. PROVISIONAL: no data with a face camera yet.
  kind:
    call_side_min: 0.35
    call_below_max: 1.0
    text_below_min: 1.0


# Block 7 - Drowsiness branch
drowsiness:
  max_gap_s: 0.5                # face dropouts shorter than this do not break an episode
  eye:
    # Eye closed = EAR below close_ratio x the driver's own open-eye EAR
    # (percentile of recent EAR), reopened above open_ratio x (hysteresis).
    baseline_init: 0.28         # used until baseline_min_data_s of data
    baseline_percentile: 90
    baseline_window_s: 120
    baseline_min_data_s: 10
    baseline_min: 0.18
    baseline_max: 0.42
    close_ratio: 0.65
    open_ratio: 0.75
    # EAR is unreliable when the head is turned / tilted down: eye state unknown.
    max_yaw_deg: 35
    max_pitch_down_deg: 25
    # When the eye-state CNN (block 5) ran, eye closed = p_closed >= cnn_closed,
    # reopened when p_closed <= cnn_open (hysteresis).
    cnn_closed: 0.6
    cnn_open: 0.4
    # Same when block 5's score is MediaPipe's eyeBlink (eye_state.source: blendshape, the web / APK
    # build). eyeBlink reads lower than the CNN on shut eyes (0.55-0.7 against ~0.9): with the CNN's
    # numbers a closure seen through eyeBlink never counted. Numbers: microsleep_deep.blendshape.
    blendshape_closed: 0.4
    blendshape_open: 0.3
    # After driver enrollment the baseline starts at the enrolled open-eye EAR and stays within
    # [1 - enrolled_max_drop, 1 + enrolled_max_rise] x it: eyes narrowing as the driver gets
    # drowsy no longer pull the baseline down and hide PERCLOS / deep closures.
    enrolled_max_drop: 0.10
    enrolled_max_rise: 0.25
  # Eyes closed, then the head drops past eye.max_pitch_down_deg (eye state unknown):
  # keep counting the closure while the head stays down / the face is lost, so the
  # microsleep L3 rule still fires. The eyes must have been closed this long before the
  # drop (a blink followed by a glance at the dashboard is not carried).
  head_drop:
    carry_min_closed_s: 0.5
  blink_max_s: 0.5             # closures up to this long are blinks
  blink_window_s: 60
  blink_rate_min_span_s: 10     # blinks/min divides by at least this: 1 blink in the first 2 s is not 30/min
  microsleep_min_s: 1.0         # closure at least this long = microsleep event
  # Only a deep closure counts toward closed_duration (microsleep event + L3 rule): on at
  # least deep_min_frac of its eye frames EAR <= deep_ear_ratio x open-eye baseline (or CNN
  # p_closed >= deep_cnn). Narrowed eyes (looking down, sun, smiling) stay at 0.55-0.75 x
  # baseline for seconds; YawDD: most false microsleeps were such. PERCLOS / blinks unchanged.
  microsleep_deep:
    ear_ratio: 0.5
    cnn: 0.8
    # Block 5 score = eyeBlink (web / APK build, eye.blendshape_closed / blendshape_open). Replay
    # 06/10 with eyeBlink deciding EVERY frame, which is what a grayscale / infrared camera gives
    # that build (colour camera: only the frames with unequal eyes, alerts about as before):
    #   closed/open/deep    own closures   false L3 while    FL3D micro-   YawDD    UTA-RLDD awake       UTA-RLDD drowsy,
    #                       at L3          looking down      sleeps at L3  L3       drowsy alerts / h    subjects with L3
    #   0.6/0.4/0.8 (CNN's) 0 / 48         0 / 30            0 / 95        0        0                    1 / 48
    #   0.5/0.35/0.55       46 / 48        4 / 30            62 / 95       1        0.25                 19 / 48
    #   0.4/0.3/0.5         46 / 48        7 / 30            72 / 95       5        0.63                 25 / 48
    #   0.4/0.3/0.55        46 / 48        3 / 30            64 / 95       1        0.50                 19 / 48
    #   0.4/0.3/0.6         46 / 48        1 / 30            57 / 95       0        0.50                 16 / 48
    #   device path (EAR)   47 / 48        7 / 30            74 / 95       1        1.13                 24 / 48
    # PROVISIONAL: colour video, no real infrared image yet (docs/improvements.md).
    blendshape: 0.55
    min_frac: 0.5
    # EAR deep frames also need MediaPipe eyeBlink >= this (0 = off): EAR also collapses for glare on
    # glasses, a head tilted down, narrow eyes before the baseline is learnt. NITYMED false microsleeps
    # 16 -> 7 / h with the same L3 recall; YawDD false microsleeps 7 -> 4.
    blink: 0.5
    # Enrolled driver (OFF, 0): the vote needs enrolled_blink_ratio x the eyeBlink of that driver's own
    # shut eyes (close-eyes step of the enrollment) when that is above `blink`. Meant for lids lowered
    # to look at a phone on the lap, which read as a deep closure (false L3 "Mở mắt!"). Measured 06/10
    # (docs/improvements.md), own recordings of one person (shut eyeBlink 0.69) and FL3D with each
    # video's first microsleep as a stand-in for the enrollment:
    #   ratio   false L3 while looking down   own closures at L3   FL3D microsleeps at L3
    #   0       7 / 30                        47 / 48              77 / 94
    #   0.8     4 / 30                        47 / 48              75 / 94
    #   0.85    2 / 30                        47 / 48              66 / 94
    #   0.9     1 / 30                        43 / 48              61 / 94
    # No ratio removes the false L3 without losing real microsleeps: a drowsy closure is shallower
    # than the driver's own deliberate one. Left off; 0.8 is the mildest setting to try.
    enrolled_blink_ratio: 0
    # Head bowed (phone, dashboard): the upper lids follow the gaze down, EAR ~0.5 x and eyeBlink ~0.6,
    # which read as a deep closure (L3 "Mở mắt!" while just looking down). Bowed >= bowed_pitch_deg
    # below the usual pose: a deep EAR frame needs EAR <= bowed_ear_ratio x baseline. FL3D real
    # microsleeps with the head bowed: EAR p90 0.33-0.41 x; 0.35 keeps all 83 L3 alerts (0.30: 81).
    # Lowered lids that are not that shut count as looking off the road (block 8, L2). TEMPORARY:
    # no dataset has drivers looking down at a phone; to be checked on own recordings.
    bowed_pitch_deg: 10         # 0 = off
    bowed_ear_ratio: 0.35
  # Eyes squeeze shut while yawning: closed-eye time is not counted in closed_duration
  # while the mouth is wide open (yawn.mar_open .. yawn.mar_close) and for hold_s after.
  # Stops after the mouth has been open max_open_s (slack jaw in sleep is not a yawn).
  # Talking masks the same way: eyes narrow / close in short spells while the mouth keeps
  # moving (>= talk_min_swings MAR reversals of >= talk_swing within talk_window_s). A still
  # mouth has none; one jump (yawn ending, jaw dropping in sleep) makes at most two.
  # PERCLOS skips these frames too when perclos_use_mask is true.
  microsleep_mask:
    hold_s: 1.5
    max_open_s: 8.0
    talk_window_s: 2.0
    talk_swing: 0.08
    talk_min_swings: 3          # 0 = no talking mask
    # Talking does not restart a deep closure (EAR shut + blendshape vote): lip movements of a sleepy
    # driver hid real microsleeps. With the vote: NITYMED microsleep >= 1.5 s at L3 68 -> 79 %, YawDD
    # false alerts unchanged (10); without the vote it adds false ones (YawDD 10 -> 14).
    talk_spares_deep: true
  # WHAT perclos_60s IS (M40): not the P80 of the literature. P80 = share of time the lids are more
  # than 80 % closed (opening below 20 %). Here a frame is closed when EAR < perclos_close_ratio x
  # the open-eye baseline: with closed eyes at ~0.35 x baseline (blink_closed_ref_ratio) that is an
  # opening below ~46 %, close to "P50", so it also counts narrowed eyes and reads higher than P80
  # on the same stretch. Two definitions are also mixed in one window: frames block 5 decided
  # count as closed on p_closed >= eye.cnn_closed, a probability and not an opening (FL3D 8.9 %,
  # SUST 7.6 % of frames). Frames masked for yawning / talking are skipped (perclos_use_mask),
  # which P80 does not do either.
  # SOURCE of perclos_drowsy / perclos_rearm and risk.drowsy.perclos_low / perclos_high: none
  # recorded. 0.15 dates from M2 (commit 4077bd5) with no reference; docs/research/2026-10-01-
  # blink-nod-brow.md only notes that 12-20 % (P80) is common in the literature and that a
  # commercial DMS video mentions ~16 %. They were then tuned by hand on YawDD / NITYMED with THIS
  # definition, so they are not P80 thresholds. Abe 2023 (Sleep Advances 4(1):zpad006) gives no
  # validated PERCLOS threshold either. Comparison of the definitions: eval/results/perclos_p80.md.
  perclos_window_s: 60
  perclos_min_coverage_s: 30    # eye data needed before PERCLOS can raise an event
  perclos_drowsy: 0.15          # PERCLOS at or above this = perclos_high event
  perclos_rearm: 0.12           # must drop below this before the next event
  perclos_use_mask: true        # skip frames masked for yawning / talking (squinting is not fatigue)
  # A frame counts as closed for PERCLOS when EAR < perclos_close_ratio x open-eye baseline,
  # judged per frame (CNN frames: p_closed >= eye.cnn_closed). Not the eye close / reopen
  # hysteresis: after a blink it keeps narrowed eyes (sun, 0.65-0.75 x baseline) "closed".
  perclos_close_ratio: 0.65
  # P80 measured next to it (perclos_p80_60s: traces and event metadata only, never in drowsy_score
  # or an event): a frame is closed when the eye opening (0 = the driver's closed EAR .. 1 =
  # open-eye baseline, as slow blinks use) is below this. Only frames where EAR decided; block 5
  # frames are unknown and lower its coverage. No yawn / talking mask, blinks kept (the original
  # definition). Without enrollment this is EAR < (0.35 + 0.2 x 0.65) = 0.48 x baseline.
  perclos_p80_aperture: 0.2
  yawn:
    mar_open: 0.45              # yawn_eye_mouth + YawDD: recall 73% -> 84% of Yawning clips, no new FP
    mar_close: 0.34
    min_s: 1.5                  # talking / laughing open the mouth for shorter
    window_s: 600
    # After driver enrollment: mar_open / mar_close = the driver's closed-mouth MAR + these
    # (lips that rest apart are not a yawn; a small mouth still reaches it).
    enrolled_open_above: 0.40
    enrolled_close_above: 0.29
  # Nod vs bow (docs/research/2026-10-01-blink-nod-brow.md): a drowsy nod drops slowly (neck
  # letting go) and jerks back up; a deliberate bow (dashboard, phone) is controlled both ways.
  # Nod = rise at least rise_speed_ratio x faster than the drop and >= min_rise_deg_s, eyes
  # closed for part of it; other dips are "bow" events (not drowsiness).
  nod:
    pitch_down_deg: 15          # dip below the driver's usual pitch (rolling median / enrolled road pose)
    return_deg: 7
    min_s: 0.2
    max_s: 2.0                  # past pitch_down_deg -> back (as v1); longer = sustained head down, not a nod
    # Nod vs bow test OFF by default (01/10 replay on FL3D / SUST traces): with ratio 1.5 + 40 deg/s
    # FL3D nods hit / false 115 / 1 (v1) -> 51 / 1, SUST nod precision 48 % -> 25 %; ratio 1.0 or
    # 1.2 also lost nods without fewer false ones. No setting beat v1 on these datasets (no bows
    # with lowered eyes in them). To try it: max_drop_s 3.0, max_rise_s 1.0, max_s 3.0,
    # rise_speed_ratio 1.5, min_rise_deg_s 40. All 0 = v1 behaviour (only "bow" events added).
    max_drop_s: 0               # leaving the usual pose -> the bottom; 0 = no limit
    max_rise_s: 0               # leaving the bottom -> back; 0 = no limit
    rise_speed_ratio: 0         # e.g. 1.5: rise at least 1.5 x faster than the drop; 0 = off
    min_rise_deg_s: 0           # e.g. 40; 0 = off
    require_eyes_closed: true   # a glance at the dashboard keeps the eyes open
    eyes_closed_min_frac: 0.3
    window_s: 300
  # Slow blinks (Caffier 2003: reopening 162 -> 273 ms when drowsy; Schleicher 2008). Each blink
  # is timed on the eye aperture (0 = the driver's closed EAR .. 1 = open-eye baseline; enrolled
  # EARs when enrolled), crossings interpolated between frames. Over the PERCLOS window:
  # blink_time_frac = time in blinks / eye-known time, reopen_ratio = median reopening time /
  # the driver's own early-trip median. slow_blink_score = max of the two ramps (drowsy_score
  # term risk.drowsy.weight_slow_blink). All TEMPORARY, to be tuned on eval data.
  blink_closed_ref_ratio: 0.35  # not enrolled: closed-eye EAR ~ this x open-eye baseline
  blink_open_level: 0.8         # aperture where a blink starts / ends
  slow_blink:
    reopen_max_s: 1.0           # a reopening not finished in this long is not measured
    min_blinks: 5               # measured blinks in the window before reopen_ratio counts
    baseline_blinks: 20         # first blinks of the trip = the driver's own reopening time
    time_frac_low: 0.10         # alert ~5-8 % of the time in blinks
    time_frac_high: 0.16        # full term (user's ~16 %, source not found yet)
    reopen_ratio_low: 1.3
    reopen_ratio_high: 1.7      # Caffier 2003: 273 / 162 ms
  # Brow raise to keep the eyes open (Vural et al. 2007, FACS AU2 = MediaPipe browOuterUp):
  # browOuterUp >= resting brow + raise_above while EAR < narrow_ratio x baseline (drooping, not
  # closed) for min_s, not while yawning / talking -> "brow_raise", counted over window_s
  # (drowsy_score term risk.drowsy.weight_brow). Resting brow: enrolled, else rolling median.
  # TEMPORARY, to be tuned on eval data.
  brow:
    raise_above: 0.2
    narrow_ratio: 0.85
    min_s: 0.5
    window_s: 300
    baseline_window_s: 120
    baseline_min_data_s: 10
  # Usual head pose = rolling median of yaw / pitch, learnt only from eyes-open frames
  # (nods with closed eyes do not drag it down). The first min_data_s are all taken.
  pose_baseline_window_s: 60
  pose_baseline_min_data_s: 5

# Block 8 - Distraction branch
# Off while the vehicle is not moving: context.min_speed_kmh (block 10) decides that.
distraction:
  yaw_off_road_deg: 30              # |yaw - baseline| above this = off road
  pitch_down_off_road_deg: 20       # looking down (lap, phone)
  pitch_up_off_road_deg: 25
  on_road_confirm_s: 0.3            # must look back this long before the timer resets
  # Turn signal on (and context.turn_signal_grace_s after): looking towards that side is
  # allowed this much further (left signal: up to 30 + 30 = 60 deg to the left). The other
  # side keeps 30 deg. Provisional, to check on real drives with a turn / lane change.
  turn_signal_extra_yaw_deg: 30
  left_yaw_sign: 1                  # yaw sign of the driver's own left (unmirrored camera: +1)
  phone_window_s: 2.0               # window for phone_ratio_2s
  baseline:                         # "looking at the road" head pose, per camera mount
    adapt: true                     # learn slowly from on-road samples
    tau_s: 30
    max_deg: 20                     # baseline never drifts beyond +-20 deg
    yaw_deg: 0.0
    pitch_deg: 0.0
    # Start-up calibration: the first calibrate_s of driving with a face set the baseline
    # to the median head pose (clamped to +-calibrate_max_deg); off road is not judged
    # meanwhile. Handles a camera mounted far to the side (> yaw_off_road_deg).
    # Adaptation then stays within +-max_deg of the calibrated pose. 0 = off.
    calibrate_s: 5.0
    calibrate_max_deg: 45
  # Many short glances (M38, measured only, no alert): off_road_ratio = share of the last window_s
  # spent off road, glance_count = times the driver looked away in it. 0 until min_coverage_s of
  # driving is in the window. PROVISIONAL window: no source read yet for a cumulative glance limit
  # (NHTSA in-vehicle device guidelines, AttenD), see docs/improvements.md.
  glance:
    window_s: 30
    min_coverage_s: 10
    max_gap_s: 0.5                  # a longer gap between frames adds no time
  # Where the eyes point below the road (measured only, no alert): gaze-down angle = head pitch off
  # the road pose + iris_gain x (iris_y off the driver's usual value; iris_y = iris centre against
  # the line through the eye corners, in eye widths). gaze_down_duration = how long it has stayed at
  # or above down_deg. For looks at a phone on the lap or a low mount, which move the eyes more than
  # the head (pitch limit: pitch_down_off_road_deg). At 12 held 2 s (eval/results/gaze_3mdad.md, own
  # recordings, FL3D): message sequences of 50 drivers 7 right hand, 13 left (off_road alert today:
  # 4 and 1), safe driving and fatigue 0 / 50, own closed eyes 0 / 48, phone on the lap 4 / 7. Too
  # weak and not clean enough for an alert: it also holds on 10 of 50 right-hand calls, and on FL3D
  # 2 times outside and 6 times inside real microsleeps in 47 min. PROVISIONAL, measured to be
  # judged on real drives. down_deg 0 = off.
  gaze:
    iris_gain: 100                  # degrees per eye width of iris_y
    down_deg: 12
    calibrate_s: 5.0                # driving time whose median iris_y is the first usual value
  # Face lost right after a large head turn (M38): the last reliable pose (at most pose_age_s old)
  # was off road and turned more than yaw_deg, so the driver is looking behind, not out of view.
  # Off road goes on for at most max_s instead of "monitoring unavailable" (risk.unavailable); then
  # unavailable as before. yaw_deg 0 = off. PROVISIONAL, no data with drivers reaching back.
  turned_away:
    yaw_deg: 45
    max_s: 10
    pose_age_s: 0.5

# Block 10 - Vehicle context (from CAN, simulated by edge_agent/context/can_sim.py)
context:
  min_speed_kmh: 5              # below this the vehicle counts as stopped (risk engine + distraction branch)
  assume_moving_when_speed_unknown: true   # no speed signal (CAN missing) = moving
  high_speed_kmh: 80            # off-road threshold tightens above this
  long_drive_s: 7200            # 2 h of driving = long drive
  night_hours: [[0, 5]]         # [start, end) local hours, may wrap midnight e.g. [22, 5]
  turn_signal_grace_s: 2.0      # looking to the signalled side stays widened this long after the blinker stops
  # Standing still = speed below stationary_kmh (crawling in a jam at 2-4 km/h is not a stop).
  # Drowsiness while standing still is capped at risk.drowsy.stationary_max_level; standing
  # still for rest_after_s is a rest (parked): no drowsiness alerts, and what was gathered
  # since the stop (eyes closed to rest) is dropped when driving resumes.
  stationary_kmh: 1.0
  rest_after_s: 120             # longer than most red lights
  # Default vehicle source = tools/drive_sim.py (later a real CAN reader). No fresh speed for this
  # long (simulator not running, link lost): never had one, or the last said standing still = parked
  # at 0 km/h; the last said driving = signal lost, speed unknown, monitored as moving (M26) and the
  # driver / backend are told (vehicle_signal_lost).
  vehicle_signal_stale_s: 1.0

# Block 9 - Risk engine (rule table: docs/workflow/workflow_full_4.jpg)
risk:
  microsleep_l3_s: 1.5          # closed_duration >= this -> L3 at once
  # Eyes still closed this long (the L3 siren has been on for seconds): L3 reason `unresponsive`,
  # a second event that goes to the backend at once (fleet view "needs attention now"). The system
  # only reads the vehicle, it never slows it down. 0 = off. PROVISIONAL: FL3D acted microsleeps
  # are 1.5-4 s, none this long.
  unresponsive:
    closed_s: 6.0
  drowsy:
    # drowsy_score = sum(weight x term), each term normalised to 0..1, total 0..100
    weight_perclos: 40
    weight_microsleep: 25
    weight_yawn: 15
    weight_nod: 20
    # Slow blinks and brow raises are measured and recorded, but add nothing to the score (weight 0,
    # M53): on UTA-RLDD (48 people, real drowsiness, own alert video against own drowsy video) neither
    # separates the two within a person (sign test p = 0.84 / 1.0 on the 24 dev subjects, 0.29 / 0.51
    # on the 24 held-out ones). Without them the score separates better (AUC drowsy vs alert 0.793 ->
    # 0.859 dev) and the four weights above add up to 100. eval/results/dataset_uta_rldd.md.
    weight_slow_blink: 0        # drowsiness.slow_blink: slow / long blinks (was 10)
    weight_brow: 0              # drowsiness.brow: brows raised to keep the eyes open (was 10)
    perclos_low: 0.05           # PERCLOS term ramps 0 -> 1 between low and high
    perclos_high: 0.20
    # No PERCLOS term before drowsiness.perclos_min_coverage_s of eye data.
    yawn_full: 3                # yawn_count_10min for a full yawn term
    nod_full: 2                 # nod_count_5min for a full nod term
    brow_full: 3                # brow_raise_count_5min for a full brow term
    microsleep_memory_s: 300    # a microsleep in the last 5 min = full microsleep term
    l1: 40
    l2: 70
    night_factor: 1.2           # score multipliers from context
    long_drive_factor: 1.2
    # Highest drowsiness level while standing still (speed below context.stationary_kmh, i.e. 0 km/h).
    # 0 (M30, 02/10): no alert at all when the vehicle stands still; distraction is already off below
    # context.min_speed_kmh. Before it was 1 (a microsleep at a red light got a chime). Drowsiness signs
    # are still measured (trip summary). 3 = no cap.
    stationary_max_level: 0
  distraction:
    off_road_s: 2.0
    off_road_high_speed_s: 1.5
    phone_ratio: 0.6
  # PRD FR-6: no face this long while moving (camera covered, driver out of view, glare) ->
  # monitoring unavailable: no alert while it lasts, the HUD and the backend are told instead.
  # A closure carried through a head drop (block 7) stays monitored (microsleep L3 goes on).
  # A face in view but unusable (quality: low_light, glare, blur) for low_quality_s: unavailable too,
  # with that reason. Longer than no_face_s: a passing shadow or a tunnel entrance is not a reason
  # to stop judging. The reason of a lost face is camera_blocked / bad_angle when the image says so,
  # else no_face. PROVISIONAL.
  unavailable:
    no_face_s: 3.0              # 0 = never unavailable
    low_quality_s: 5.0          # 0 = a poor face never makes monitoring unavailable
  # Rising-score early warning: note only since M53 (was level 1). On UTA-RLDD it was in 5 of the 9
  # drowsiness false alarms of 24 alert people (dev) and 3 of 8 on the held-out 24; with it off and
  # the two weights above at 0, false alarms 9 -> 5 (dev) and 8 -> 4 (held out, 1.96 -> 0.98 / h),
  # L3 detections unchanged. Those videos are 10 min long: whether it helps on drives of hours is
  # not measured; set level back to 1 to try it there.
  trend:
    level: 0                    # 0 = note only; 1 = early warning "suggest a break"
    min_points: 5               # minutes of history needed
    slope_per_min: 2.0          # drowsy_score points per minute
    min_score: 20               # ignore a rising trend while the score is still low
  blink:
    normal_min: 10              # blinks / min outside [min, max] = early fatigue sign
    normal_max: 30
    min_observed_s: 60
    level: 0                    # 0 = note only (blink rate varies a lot between people)

# Block 11 stage - Trip summary (edge_agent/decision/trip_summary.py), built when the trip ends
# ("Kết thúc chuyến" on the HUD, or the agent stopping) and sent to the backend for the driver and
# the higher roles. The assessment describes the trip, it does not grade the driver.
# "Tired" minute = drowsy_score >= risk.drowsy.l1; long drive = context.long_drive_s.
trip_summary:
  max_frame_gap_s: 1.0          # a longer gap between frames (stall) adds no time
  risk_on_l3: true              # any L3 alert / microsleep -> "risk"
  attention_alerts_per_hour: 2.0  # L2+ alerts per driving hour -> "attention"
  attention_min_alerts: 2         # ... and at least this many: 1 alert in a 10-minute trip is not "frequent"
  attention_tired_minutes: 5    # tired minutes -> "attention"
  min_monitored_frac: 0.6       # face seen on less of the driving time: "low coverage" (numbers incomplete)
  rest_margin_min: 10           # suggest a rest this long before fatigue first showed
  min_rest_suggestion_min: 15

# Block 11 - Trip memory
trip_memory:
  bin_s: 60                     # one drowsy_score point per minute
  trend_window_bins: 15         # trend over the last 15 minutes

# Block 12 - Alert manager
alert:
  rise_confirm_s: {1: 1.0, 2: 0.5, 3: 0.0}   # a level must hold this long before it is raised
  fall_hold_s: 3.0                           # and stay lower this long before it is dropped
  # No repeated alert of the same (level, reason) within this. A new reason at the
  # active level (L2 off_road, then L2 phone) is emitted after rise_confirm_s.
  # L3 has none: fall_hold_s already keeps it from flickering, so a new L3 means the eyes were open
  # >= 3 s and closed again, a new microsleep (NITYMED: new L3 alert on 55 -> 76 % of microsleeps).
  cooldown_s: {1: 120, 2: 30, 3: 0}
  # Escalation over time (M32): the l1_repeat_count-th L1 alert of the same reason within
  # l1_repeat_window_s goes out as L2 (reason repeated_l1 added): told several times, still not
  # resting. With the 120 s L1 cooldown, 3 alerts take at least 4 minutes. A rest (context.rest_after_s)
  # or a driver change restarts the count. 0 = off. Provisional: no dataset has drives this long.
  l1_repeat_count: 3
  l1_repeat_window_s: 600
  # Repeated L3 (M44): the l3_repeat_count-th L3 alert within l3_repeat_window_s carries the reason
  # repeated_l3 (the driver keeps falling asleep); sent at once, shown on the fleet view while it
  # happens. A rest or a driver change restarts the count. 0 = off. Provisional.
  l3_repeat_count: 3
  l3_repeat_window_s: 600

# Block 12 stage - Presence check (edge_agent/decision/presence.py, docs/safety-fmea.md row 6).
# Face lost while moving with a normal image (unavailable, reason no_face) for ask_after_s: the HUD
# asks "Bạn còn ở đó không?" with a sound; one tap anywhere answers, and so does the face coming
# back. No answer for answer_s: `no_answer` goes to the backend at once. ask_after_s counts from
# the moment monitoring became unavailable (risk.unavailable.no_face_s after the face was lost).
# PROVISIONAL: no data on how long drivers lean out of view on purpose (toll booth, mirror).
presence:
  enabled: true
  ask_after_s: 5.0
  answer_s: 10.0

# Block 13 - In-car HUD server
hud:
  feedback_window_s: 120        # the driver can press "false alarm" on an alert for this long
  # Processing loop health (M28, docs/safety-fmea.md rows 3, 9). Frames failing (exception in blocks
  # 2-14) for this long: "Lỗi xử lý" on the HUD with a loud sound, agent_error to the backend; the
  # loop goes on and agent_recovered follows the next good frame.
  processing_error_s: 1.0
  # FPS (smoothed) below low_fps_below for low_fps_s: the HUD warns that alerts may be late, low_fps
  # to the backend. 15 FPS is the CLAUDE.md minimum; 0.5 of slack for the measurement. Load shedding
  # (docs/improvements.md, hardware task) comes with the hub.
  low_fps_below: 14.5
  low_fps_s: 5.0
  # Fatigue chart of the HUD (M65): drowsy_score of each of the last trend_minutes minutes, kept by
  # the agent for the whole trip (block 11), so a HUD that reloads shows it again at once.
  trend_minutes: 15

# Block 14 - Metadata publisher (backend URL / device key come from the command line / env)
publisher:
  batch_size: 20                # events per POST
  flush_interval_s: 5.0         # send at least this often while events are waiting
  timeout_s: 5.0
  outbox_path: data/outbox.db   # offline queue on the device: metadata JSON only
  max_queue: 10000              # oldest events dropped beyond this
  backoff_initial_s: 1.0        # retry delay after a failure, doubling up to backoff_max_s
  backoff_max_s: 60.0
  # Heartbeat (M33): "still alive" to the backend this often, and at once when the monitoring state
  # changes. The backend calls a device offline after DG_DEVICE_OFFLINE_AFTER_S (90 s = 3 beats). 0 = off.
  heartbeat_interval_s: 30.0
  # The loop is alive but no frame came for this long while the camera is not reported lost
  # (page in the background, camera thread stuck): the heartbeat says "stalled", not "monitoring".
  heartbeat_stalled_s: 10.0
  # Thresholds tuned on the dashboard (M47): ask the backend again this often during the trip. A
  # changed version (newer, rolled back, or pinned to this device for a trial) is applied only
  # while the vehicle is parked, then `config_applied` goes to the backend. 0 = only at start-up.
  config_poll_s: 300.0

# Evaluation tools only (tools/metrics.py, used by tools/eval.py and tools/seq_eval.py), never read
# by the agent. FAR / MAR on fixed windows, next to false alarms per hour (docs/improvements.md §2).
eval:
  window_s: 10                  # window length, not overlapping
  warmup_s: 30                  # left out at each clip start (baselines, PERCLOS window), reported apart
  positive_frac: 0.5            # drowsy window: ≥ this inside a labelled episode; awake: ≥ this known-awake
  min_level: 1                  # predicted drowsy: the branch reaches this level in the window (L2 also reported)
  # Own recordings (tools/record_trace.py): an alert / event up to this long before the key press or
  # after the label's end still belongs to it (the person presses the key about when they start).
  label_tolerance_s: 1.0
  # tools/trace_studies.py lighting: results are split by the median face brightness of a video
  # (mean luminance 0-255 of the face before CLAHE, the number of eye_state.low_light_brightness).
  # The first edge is that threshold, so the first bin is "block 5 does not trust EAR".
  brightness_bins: [60, 100, 140]
  # tools/trace_studies.py personal: the first seconds of a person's awake clip stand in for driver
  # enrollment (medians of the good frames = open-eye EAR, closed-mouth MAR, road pose).
  fake_enroll_s: 10
  # tools/light_study.py: the same videos run again darkened (gamma: out = 255 x (in / 255) ^ g),
  # overexposed (gain: in x k, clipped), blurred (Gaussian sigma in pixels at 640 px width), in RAM.
  light_gammas: [1.5, 2.2, 3.5, 5.0]
  light_gains: [1.5, 2.5, 4.0]
  light_blur_sigmas: [1.5, 3.0, 6.0]
  # tools/benchmark.py --duration (long run): every minute must keep at least soak_min_fps
  # (CLAUDE.md: 15 FPS), and resident memory must grow by less than this after the first minute
  # (a leak: frames live in RAM only, none may be kept). PROVISIONAL growth limit.
  soak_min_fps: 15
  soak_rss_growth_mb_per_h: 20
