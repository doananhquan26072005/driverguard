name: CI

on:
  push:
    # DAQuan is the working branch (CONTRIBUTING.md): checked on every push, not only once a PR is open.
    branches: [main, develop, DAQuan]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR replaces the run still going. Runs on main are never cancelled
# (each one may deploy): their group carries the commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  # DriverGuard: edge agent, backend, tools (requirements-dev.txt only, no LangChain).
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check edge_agent/ backend/ tools/ tests/

      - name: Check formatting
        run: ruff format --check edge_agent/ backend/ tools/ tests/

      - name: Run tests
        # tests/test_agents and tests/test_api (course template) are skipped: no LangGraph here.
        run: pytest tests/ -v --tb=short

  # DriverGuard on the real pretrained files (M87). The `python` job has no model: every test there
  # runs on fake numbers and the real-model tests skip. Here the three files are fetched (sha256 against
  # the pinned ones), blocks 3-6 run on a face drawn with ellipses (tools/drawn_face.py: no face image
  # in the repo), and the main loop is timed against eval.soak_min_fps (15 FPS).
  # The FPS is the one of this runner on a drawn face: it catches a model or a slow step added to the
  # main loop, it is not the FPS of the vehicle's screen.
  models:
    runs-on: ubuntu-latest
    env:
      DG_REQUIRE_MODELS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Restore pretrained models
        uses: actions/cache@v4
        with:
          path: |
            models/face_landmarker.task
            models/open_closed_eye.onnx
            models/yolov8n.onnx
          key: models-${{ hashFiles('tools/download_models.py') }}

      - name: Download pretrained models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          # YOLOv8n is an export, not a download: it comes from the release `models-v1`, like the deploy.
          [ -f models/yolov8n.onnx ] || gh release download models-v1 --dir models --pattern yolov8n.onnx
          # The other two from their publishers; a file whose sha256 is not the pinned one stops here.
          python tools/download_models.py
          ls -l models/

      - name: Run blocks 3-6 on the real models
        run: pytest tests/test_edge_agent/test_m87_ci_real_models.py tests/test_edge_agent/test_eye_state.py -v --tb=short -rs

      - name: Measure FPS of the main loop
        # 90 s flat out: one full minute and a second one of 30 s are judged. Exit code 1 under 15 FPS.
        run: |
          python tools/benchmark.py --duration 90s --pace-fps 0 --condition drawn_face \
            --label "GitHub runner" --check --out benchmark_ci.md --json benchmark_ci.json

      - name: Show the measurement
        if: always()
        run: |
          [ -f benchmark_ci.md ] && cat benchmark_ci.md >> "$GITHUB_STEP_SUMMARY" || echo "no measurement was written" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: |
            benchmark_ci.md
            benchmark_ci.json
          if-no-files-found: ignore
          retention-days: 14

  # DriverGuard dashboard + HUD (React / TypeScript).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npx vite build

  # DriverGuard web app end to end (Playwright): #/live with Pyodide running edge_agent/, the backend on a
  # throwaway database, Chrome's fake camera and synthetic landmark numbers (no face image, no model file).
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # DriverGuard on Railway (M66): a push to main deploys only after the three DriverGuard jobs pass.
  # Railway builds Dockerfile.railway itself; the two pretrained models are not in git, so they come
  # from the GitHub release `models-v1`. Needs the secret RAILWAY_TOKEN (project token) and the
  # variable RAILWAY_SERVICE (service name), see docs/deploy-railway.md.
  deploy:
    needs: [python, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: railway-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::secret RAILWAY_TOKEN is not set"; exit 1; }
          [ -n "$RAILWAY_SERVICE" ] || { echo "::error::variable RAILWAY_SERVICE is not set"; exit 1; }

      - name: Download pretrained models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download models-v1 --dir models --pattern face_landmarker.task --pattern yolov8n.onnx
          ls -l models/face_landmarker.task models/yolov8n.onnx
          # sha256 against the pinned ones: a face model that differs stops the deploy; the YOLO export
          # is only reported until the release holds the measured file (then add --strict).
          python3 tools/download_models.py --verify

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --no-gitignore: .gitignore holds the models back; .railwayignore lists what must not be sent.
        run: npx -y @railway/cli@5 up --ci --no-gitignore --service "${{ vars.RAILWAY_SERVICE }}"

  # Course template (src/, LangGraph / LangChain). Kept separate so it cannot hide DriverGuard results.
  template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-template.txt

      - name: Install dependencies
        run: pip install -r requirements-template.txt ruff

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: pytest tests/test_agents tests/test_api -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
