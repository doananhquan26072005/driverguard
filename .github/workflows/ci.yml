name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # DriverGuard: edge agent, backend, tools (requirements-dev.txt only, no LangChain).
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check edge_agent/ backend/ tools/ tests/

      - name: Check formatting
        run: ruff format --check edge_agent/ backend/ tools/ tests/

      - name: Run tests
        # tests/test_agents and tests/test_api (course template) are skipped: no LangGraph here.
        run: pytest tests/ -v --tb=short

  # DriverGuard dashboard + HUD (React / TypeScript).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npx vite build

  # Course template (src/, LangGraph / LangChain). Kept separate so it cannot hide DriverGuard results.
  template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-template.txt

      - name: Install dependencies
        run: pip install -r requirements-template.txt ruff

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: pytest tests/test_agents tests/test_api -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
