<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kiến trúc hệ thống DriverGuard</title>
<desc id="d">Frontend React, edge agent 14 khối chạy trên thiết bị, Backend FastAPI, SQLite và nguồn model pretrained, cùng các luồng dữ liệu giữa chúng.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">DriverGuard · kiến trúc hệ thống</text>
<text x="40" y="66" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Giám sát tài xế on-device: ảnh khuôn mặt không rời thiết bị, backend chỉ nhận JSON metadata</text>
<rect x="40" y="84" width="1520" height="172" rx="12" fill="#eaf2fd" stroke="#3b73c4" stroke-width="2"/>
<text x="58" y="110" font-size="16" font-weight="700" fill="#3b73c4" text-anchor="start">Frontend · React 19 + Vite + Tailwind v4</text>
<text x="58" y="129" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Một bundle, bốn trang theo hash route; trình duyệt tải từ cùng origin với Backend</text>
<rect x="40" y="400" width="640" height="335" rx="12" fill="#e9f6ec" stroke="#3d8b55" stroke-width="2"/>
<text x="662" y="426" font-size="16" font-weight="700" fill="#3d8b55" text-anchor="end">Agent · edge_agent (Python, 14 khối)</text>
<text x="662" y="445" font-size="12" font-weight="400" fill="#52606d" text-anchor="end">Chạy trên thiết bị trong xe · frame chỉ nằm trong RAM · model pretrained + luật, không có LLM</text>
<rect x="880" y="400" width="680" height="335" rx="12" fill="#fff3e0" stroke="#c77f1a" stroke-width="2"/>
<text x="898" y="426" font-size="16" font-weight="700" fill="#c77f1a" text-anchor="start">Backend API · FastAPI</text>
<text x="898" y="445" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Railway, một container · không chạy model nào · chỉ nhận JSON metadata</text>
<rect x="40" y="800" width="640" height="130" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="58" y="826" font-size="16" font-weight="700" fill="#6b7280" text-anchor="start">External · nguồn model pretrained</text>
<text x="58" y="845" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Chỉ dùng lúc cài đặt / build image; lúc chạy hệ thống không gọi API bên ngoài nào</text>
<rect x="70" y="152" width="320" height="88" rx="7" fill="#ffffff" stroke="#3b73c4" stroke-width="1.2"/>
<text x="230.0" y="174" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">#/hud · màn hình trong xe</text>
<text x="230.0" y="194" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Mức L0–L3, lý do, âm báo</text>
<text x="230.0" y="212" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Đăng ký tài xế, kết thúc chuyến</text>
<rect x="420" y="152" width="580" height="88" rx="7" fill="#ffffff" stroke="#3b73c4" stroke-width="1.2"/>
<text x="710.0" y="174" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">#/live · cả agent chạy trong trình duyệt</text>
<text x="710.0" y="194" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Khối 1–5: getUserMedia, MediaPipe Tasks JS, onnxruntime-web (cùng 2 file model)</text>
<text x="710.0" y="212" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Khối 6–12: cùng code Python của thiết bị, chạy bằng Pyodide · HUD ngay trong trang</text>
<rect x="1030" y="152" width="240" height="88" rx="7" fill="#ffffff" stroke="#3b73c4" stroke-width="1.2"/>
<text x="1150.0" y="174" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">#/drive · điều khiển xe</text>
<text x="1150.0" y="194" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Tốc độ, xi nhan (thay CAN thật)</text>
<text x="1150.0" y="212" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Ghép với #/live bằng mã</text>
<rect x="1300" y="152" width="230" height="88" rx="7" fill="#ffffff" stroke="#3b73c4" stroke-width="1.2"/>
<text x="1415.0" y="174" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">#/dashboard</text>
<text x="1415.0" y="194" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Tài xế · quản lý · kỹ sư · admin</text>
<text x="1415.0" y="212" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Sự kiện, báo cáo chuyến, ngưỡng</text>
<rect x="60" y="462" width="250" height="74" rx="7" fill="#ffffff" stroke="#3d8b55" stroke-width="1.2"/>
<text x="185.0" y="484" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">13 HUD server</text>
<text x="185.0" y="504" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">HTTP cục bộ 127.0.0.1:8765</text>
<rect x="420" y="462" width="240" height="74" rx="7" fill="#ffffff" stroke="#3d8b55" stroke-width="1.2"/>
<text x="540.0" y="484" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">14 Metadata publisher</text>
<text x="540.0" y="504" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Outbox SQLite · lô ≤ 20 · chặn ảnh</text>
<rect x="60" y="596" width="184" height="122" rx="7" fill="#ffffff" stroke="#3d8b55" stroke-width="1.2"/>
<text x="152.0" y="618" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Nhận diện · khối 1–6</text>
<text x="152.0" y="638" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">1 Camera → 2 Tiền xử lý</text>
<text x="152.0" y="656" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">3 MediaPipe · 4 YOLOv8n</text>
<text x="152.0" y="674" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">6 Đặc trưng EAR/MAR/pose</text>
<text x="152.0" y="692" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">5 CNN mắt khi EAR kém</text>
<rect x="268" y="596" width="184" height="122" rx="7" fill="#ffffff" stroke="#3d8b55" stroke-width="1.2"/>
<text x="360.0" y="618" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Phân tích · khối 7–8</text>
<text x="360.0" y="638" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">7 Buồn ngủ: PERCLOS,</text>
<text x="360.0" y="656" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">microsleep, ngáp, gật</text>
<text x="360.0" y="674" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">8 Mất tập trung:</text>
<text x="360.0" y="692" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">nhìn lệch, điện thoại</text>
<rect x="476" y="596" width="184" height="122" rx="7" fill="#ffffff" stroke="#3d8b55" stroke-width="1.2"/>
<text x="568.0" y="618" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Quyết định · khối 9–12</text>
<text x="568.0" y="638" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">9 Risk engine L0–L3</text>
<text x="568.0" y="656" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">10 Ngữ cảnh xe (tốc độ)</text>
<text x="568.0" y="674" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">11 Trip memory</text>
<text x="568.0" y="692" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">12 Alert manager</text>
<rect x="900" y="462" width="206" height="74" rx="7" fill="#ffffff" stroke="#c77f1a" stroke-width="1.2"/>
