<text x="1344" y="846" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">LLM, LangGraph, Vector Store.</text>
<text x="1344" y="864" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">“Agent” ở đây là pipeline thị giác</text>
<text x="1344" y="882" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">+ luật chạy on-device; dữ liệu</text>
<text x="1344" y="900" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">là bảng quan hệ, không RAG.</text>
