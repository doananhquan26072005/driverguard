<text x="1220.0" y="590" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">/drive/{code}</text>
<text x="1220.0" y="608" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Chỉ giữ trong RAM</text>
